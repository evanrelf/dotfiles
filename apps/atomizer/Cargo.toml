[package]
name = "atomizer"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
atom_syndication = "0.12.10"
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
etcetera = "0.11.0"
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "jiff"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
zstd = "0.14.0"

[lints]
clippy.pedantic = { level = "warn", priority = -1 }
